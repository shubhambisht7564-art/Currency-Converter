<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Converter</title>
    <link href="style.css" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>
<body>
    <div class="container">
        <h2>Currency Converter</h2>
        <form>
            <div class="amount">
                <p>Enter Amount</p>
                <input value="1" type="text" id="amount-input">
            </div>
            
            <div class="dropdown">
               <div class="from">
                  <p>From</p>
                  <div class="select-container">
                     <img src="https://flagsapi.com/US/flat/64.png" id="from-flag">
                     <select name="from" class="currency-select" id="from-select">
                        <!-- Options populated dynamically or standard options -->
                     </select>
                  </div>
               </div>
              
               <i class="fa-solid fa-arrow-right-arrow-left" id="swap-icon"></i>

               <div class="to">
                   <p>To</p>
                   <div class="select-container">
                     <img src="https://flagsapi.com/IN/flat/64.png" id="to-flag">
                     <select name="to" class="currency-select" id="to-select">
                        <!-- Options populated dynamically or standard options -->
                     </select>
                   </div>
               </div>
            </div>

            <div class="msg" id="exchange-msg">1 USD = 83 INR</div>
            <button type="submit" id="get-rate-btn">Get Exchange Rate</button>
        </form>
    </div>

    <script src="code.js"></script>  
    <script src="script.js"></script>  
</body>
</html>
